name = "quire"
main = "worker/index.js"
compatibility_date = "2026-01-15"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]
not_found_handling = "single-page-application"

[[durable_objects.bindings]]
name = "PROJECT"
class_name = "Project"

[[durable_objects.bindings]]
name = "REGISTRY"
class_name = "Registry"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Project", "Registry"]

[vars]
# Fill these in from Cloudflare Zero Trust > Access > Applications > (your Quire app). See README step 4.
ACCESS_TEAM_DOMAIN = ""   # e.g. "https://yourteam.cloudflareaccess.com"
ACCESS_AUD = ""           # the application's "Application Audience (AUD) Tag"
SNAPSHOT_MINUTES = "30"
# GITHUB_TOKEN is a secret: npx wrangler secret put GITHUB_TOKEN
