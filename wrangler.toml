name = "quire"
main = "worker/index.js"
compatibility_date = "2026-01-15"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]
not_found_handling = "single-page-application"

[[durable_objects.bindings]]
name = "PROJECT"
class_name = "Project"

[[durable_objects.bindings]]
name = "REGISTRY"
class_name = "Registry"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Project", "Registry"]

[vars]
# Fill these in from Cloudflare Zero Trust > Access > Applications > (your Quire app). See README step 4.
ACCESS_TEAM_DOMAIN = "https://steep-cherry-ee90.cloudflareaccess.com"
ACCESS_AUD = "af9200c6a74d996251960e3ab7565f166d75c942cf7df285777807619d5e7658"
SNAPSHOT_MINUTES = "30"
# GITHUB_TOKEN is a secret: npx wrangler secret put GITHUB_TOKEN
